<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} · Marina{% else %}Marina — a strictly-typed, AOT-compiled subset of TypeScript{% endif %}</title>
  <meta name="description" content="{{ description or 'Marina is a strictly-typed, ahead-of-time compiled subset of TypeScript that emits LLVM IR and links against a custom C++ runtime.' }}">
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <div class="sea" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/mark.svg" alt=""> Marina</a>
      <nav>
        <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
        <div class="nav-drop">
          <a href="/docs/language" {% if page.url != '/' %}class="active"{% endif %}>Docs <span class="caret">▾</span></a>
          <div class="drop-menu">
            <a href="/docs/language" {% if page.url == '/docs/language' %}class="current"{% endif %}>Language</a>
            <a href="/docs/stdlib" {% if page.url == '/docs/stdlib' %}class="current"{% endif %}>Std library</a>
            <a href="/docs/wave" {% if page.url == '/docs/wave' %}class="current"{% endif %}>Wave</a>
            <a href="/docs/packages" {% if page.url == '/docs/packages' %}class="current"{% endif %}>Packages</a>
            <a href="/docs/internals" {% if page.url == '/docs/internals' %}class="current"{% endif %}>Internals</a>
            <a href="/benchmark" {% if page.url == '/benchmark' %}class="current"{% endif %}>Benchmarks</a>
          </div>
        </div>
        <a class="gh-btn" href="https://github.com/marina-lang-hq/marina" aria-label="GitHub repository">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>
  <p class="banner">Experimental. Do not use in production.</p>

  <main>{{ content | safe }}</main>

  <footer class="footer">
    <div class="wrap foot">
      <p>marina v0.2.0 · experimental</p>
      <p><a href="https://marina-lang.org">marina-lang.org</a></p>
    </div>
  </footer>
</body>
</html>
